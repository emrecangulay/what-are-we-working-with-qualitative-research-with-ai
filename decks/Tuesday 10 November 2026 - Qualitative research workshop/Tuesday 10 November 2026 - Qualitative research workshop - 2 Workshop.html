&lt;p class=&quot;sr-only&quot;&gt;Figure description: Stories, letters, songs and conversations illustrate possible training materials. We do not know the full contents of the training data. In a recorded conversation about weekly meetings, the demo’s closest role matches are moderator for reply 1, pragmatist for reply 2 and negotiator for reply 4.&lt;/p&gt;
